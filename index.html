<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy-A-Smile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1 class="logo">Buy-A-Smile 😂🤣</h1>
    </header>

    <div class="teladeentrada">
        <div class="entrada">
            <h1 class="titulo">Bem-vindo ao Buy-A-Smile!</h1>
            <p class="descricao">Aqui você pode comprar sorrisos e espalhar alegria pelo mundo!</p>
            <button class="botao-comecar" id="startbut">Começar</button>
        </div>
    </div>

    <div class="chao">
        <div class="Portal">
            <div class="Portal1">
                <img src="Nether_portal_(animated).png" alt="Portal1" class="Portal1"> 
            </div>
            <div class="Portal2">
                <img src="Nether_portal_(animated).png" alt="Portal2" class="Portal2">  
            </div>
        </div>

        <button type="button" class="botao-imagem">
            <img src="Tung-Tung-Tung-Sahur-Transparent-HQ.png" alt="Personagem correndo" class="item-esteira">    
        </button>
    </div>
    
    <script src="script.js" defer></script>
</body>
</html>
